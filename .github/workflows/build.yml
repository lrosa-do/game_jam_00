name: build

# Runs when the commit message says "release" (for example "release: build 3"), or by hand from
# the Actions tab; ordinary pushes do not build.
on:
  push:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release')
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools libvulkan-dev libegl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libgl-dev libasound2-dev
      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPRISMA3D_BUILD_TESTS=OFF -DPRISMA3D_WERROR=OFF -DPRISMA3D_USE_MOLD=OFF -DPRISMA3D_USE_CCACHE=OFF
      - name: Build
        run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: engine-linux
          path: engine/bin

  windows:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          cache: true
      - name: Configure
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release -DPRISMA3D_BUILD_TESTS=OFF -DPRISMA3D_WERROR=OFF
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: engine/bin

  release:
    needs: [linux, windows]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-linux
          path: engine/bin
      - uses: actions/download-artifact@v4
        with:
          name: engine-windows
          path: win
        continue-on-error: true
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libx11-6 libxi6 libxcursor1 libxrandr2 libxinerama1 libxkbcommon0 libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1 zip
          chmod +x engine/bin/*
      # One pack for both: the Linux and the Windows runner read the same data.rpak next to them.
      - name: Export Linux
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p out/game
          engine/bin/export game/projecto.json -o out/game/NULL_PROTOCOL --platform linux --runner engine/bin/runner --no-shader-cache
          cp game/NOTAS_DE_JOGO.md out/game/
      - name: Export Windows
        continue-on-error: true
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          test -f win/Release/runner.exe
          mkdir -p out/windows
          engine/bin/export game/projecto.json -o out/windows/NULL_PROTOCOL.exe --platform windows --runner win/Release/runner.exe --no-shader-cache
          rm out/windows/data.rpak
          cp out/windows/* out/game/
      - name: Game zip
        run: (cd out/game && zip -q -r ../NULL_PROTOCOL.zip .)
      - name: Engine zips (editor, runner, export, pack)
        run: |
          (cd engine/bin && zip -q -r ../../out/prisma3d_engine_linux.zip .)
          if [ -f win/Release/runner.exe ]; then (cd win/Release && zip -q -r ../../out/prisma3d_engine_windows.zip .); fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: NULL PROTOCOL build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.zip
