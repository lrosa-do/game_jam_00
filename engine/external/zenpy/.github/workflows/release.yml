name: Release

# A tag v* builds every platform, runs the suite where the binary can run,
# packages the artifacts the README promises, and publishes a GitHub Release.
# workflow_dispatch does the same dry: it ends in a DRAFT prerelease you can
# inspect and delete, and creates no tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        run: bash ./run_tests.sh --verbose
      - name: Package
        run: |
          strip bin/zen
          mkdir -p pkg && cp bin/zen LICENSE README.md pkg/
          tar -C pkg -czf zen-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with: { name: pkg-linux, path: zen-linux-x86_64.tar.gz }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        run: bash ./run_tests.sh --verbose
      - name: Package
        run: |
          strip bin/zen
          mkdir -p pkg && cp bin/zen LICENSE README.md pkg/
          tar -C pkg -czf zen-macos-arm64.tar.gz .
      - uses: actions/upload-artifact@v4
        with: { name: pkg-macos, path: zen-macos-arm64.tar.gz }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -A x64 && cmake --build build --config Release
      - name: Test
        shell: bash
        run: ZEN=./bin/zen.exe EMBED=./bin/test_embedding.exe INFO=./bin/test_script_info.exe bash ./run_tests.sh --verbose
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg && cp bin/zen.exe LICENSE README.md pkg/
          cd pkg && 7z a ../zen-windows-x64.zip .
      - uses: actions/upload-artifact@v4
        with: { name: pkg-windows, path: zen-windows-x64.zip }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache
      - name: Build
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DZEN_BIN_DIR=${{ github.workspace }}/out
          cmake --build build-web
      - name: Test under node
        run: ZEN=./out/zen.js EMBED=./out/test_embedding.js INFO=./out/test_script_info.js ZEN_RUNNER=node bash ./run_tests.sh --verbose
      - name: Package
        run: |
          mkdir -p pkg && cp out/zen.js out/zen.wasm LICENSE README.md pkg/
          cd pkg && zip -q ../zen-web-wasm.zip .  -r
      - uses: actions/upload-artifact@v4
        with: { name: pkg-web, path: zen-web-wasm.zip }

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DZEN_BIN_DIR=${{ github.workspace }}/out
          cmake --build build-android
      - name: Package
        run: |
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip out/zen
          mkdir -p pkg && cp out/zen build-android/libzen/libzen.a LICENSE pkg/
          tar -C pkg -czf zen-android-${{ matrix.abi }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-android-${{ matrix.abi }}
          path: zen-android-${{ matrix.abi }}.tar.gz

  publish:
    needs: [linux, macos, windows, web, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: What goes into the release
        run: ls -la artifacts && file artifacts/* || true
      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "zen $GITHUB_REF_NAME" --generate-notes
      - name: Draft prerelease (manual dry run)
        if: github.event_name == 'workflow_dispatch'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "dry-run-${{ github.run_number }}" artifacts/* \
            --draft --prerelease \
            --title "Dry run #${{ github.run_number }} (delete me)" \
            --notes "workflow_dispatch dry run — no tag was created; delete after inspecting."
