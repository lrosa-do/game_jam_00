name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- desktop --
  linux:
    name: linux-${{ matrix.cc }}-${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc,   cxx: g++,     build_type: Release }
          - { cc: gcc,   cxx: g++,     build_type: Debug }
          - { cc: clang, cxx: clang++, build_type: Debug }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: bash ./run_tests.sh --verbose
      - name: Inspect binary
        run: file bin/zen
      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc' && matrix.build_type == 'Release'
        with:
          name: zen-linux-x86_64
          path: bin/zen

  # Feeds arbitrary bytes to the compiler + VM under ASan+UBSan, with GC
  # forced on every allocation (ZEN_DEBUG_STRESS_GC) so marking bugs surface
  # immediately instead of waiting for a real threshold-triggered collection.
  # Bounded to a smoke run — deep fuzzing is a local/scheduled concern, not
  # every PR's.
  linux-fuzz:
    name: linux-fuzz (clang, ASan+UBSan, stress-GC)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DZEN_BUILD_FUZZ=ON
      - name: Build
        run: cmake --build build --target fuzz_zen -j"$(nproc)"
      - name: Fuzz the compiler + VM (bounded)
        run: ./bin/fuzz_zen -max_total_time=60 -max_len=4096 -timeout=5

  # Exercises the public C++ embedding API + native re-entrancy, independent
  # of fuzz_zen's source-parsing corpus (see tests/fuzz/CMakeLists.txt).
  fuzz-embedding:
    name: fuzz-embedding (clang, ASan+UBSan, stress-GC)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DZEN_BUILD_FUZZ=ON
      - name: Build
        run: cmake --build build --target fuzz_embedding -j"$(nproc)"
      - name: Fuzz the embedding API (bounded)
        run: ./bin/fuzz_embedding tests/fuzz/corpus_embedding -max_total_time=60 -max_len=4096 -timeout=5

  # The switch dispatch path is what MSVC and any non-GNU compiler take, and it
  # is dead code under gcc/clang — build it here so it cannot rot unnoticed.
  linux-switch-dispatch:
    name: linux-switch-dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-DZEN_DISPATCH_MODE=1
      - name: Build
        run: cmake --build build
      - name: Test
        run: bash ./run_tests.sh --verbose

  # The embedder hook Kinetix2D and the other hosts build against.
  linux-host-output:
    name: linux-host-output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZEN_HOST_OUTPUT=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: bash ./run_tests.sh --verbose

  # A host that trims modules it does not ship must still link and run — this is
  # the shape Radion builds. Keeping it in CI means adding a builtin_*.cpp
  # upstream cannot quietly break the trimmed builds.
  linux-trimmed-modules:
    name: linux-trimmed-modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure without numpy, net and http
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DZEN_MODULE_NUMPY=OFF -DZEN_MODULE_NET=OFF -DZEN_MODULE_HTTP=OFF
      - name: Build
        run: cmake --build build
      - name: The trimmed binary runs, and the dropped modules are gone
        run: |
          ./bin/zen -e 'import math'
          ./bin/zen -e 'import numpy' 2>&1 | grep -q "module 'numpy' not found"
          ./bin/zen -e 'import net'   2>&1 | grep -q "module 'net' not found"
          ./bin/zen -e 'import http'  2>&1 | grep -q "module 'http' not found"
      - name: The suite still passes for what is left
        run: |
          for t in tests/[0-9]*.py; do
            case "$t" in *26_numpy*|*33_net*|*34_http*) continue ;; esac
            ./bin/zen "$t" > /dev/null || { echo "::error::$t failed"; exit 1; }
          done

  macos:
    name: macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: bash ./run_tests.sh --verbose
      - name: Inspect binary
        run: file bin/zen
      - uses: actions/upload-artifact@v4
        with:
          name: zen-macos-arm64
          path: bin/zen

  # ---------------------------------------------------------------- windows --
  windows-msvc:
    name: windows-msvc-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        shell: bash
        run: ZEN=./bin/zen.exe EMBED=./bin/test_embedding.exe INFO=./bin/test_script_info.exe GCNATIVE=./bin/test_gc_native.exe bash ./run_tests.sh --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: zen-windows-msvc-x64
          path: bin/zen.exe

  windows-mingw:
    name: windows-mingw-x64 (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-mingw-w64-x86-64
      - name: Cross-configure
        run: |
          cmake -S . -B build-mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DZEN_BIN_DIR=${{ github.workspace }}/out
      - name: Build
        run: cmake --build build-mingw
      - name: Verify it is a Windows binary
        run: |
          file out/zen.exe
          file out/zen.exe | grep -q 'PE32+ executable' \
            || { echo "::error::zen.exe is not a PE32+ Windows binary"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: zen-windows-mingw-x64
          path: out/zen.exe

  # -------------------------------------------------------------------- web --
  web:
    name: web-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache
      - name: Configure
        run: |
          emcmake cmake -S . -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZEN_BIN_DIR=${{ github.workspace }}/out
      - name: Build
        run: cmake --build build-web
      - name: Verify the wasm output
        run: |
          ls -la out
          test -f out/zen.js && test -f out/zen.wasm
          file out/zen.wasm
          file out/zen.wasm | grep -q 'WebAssembly' \
            || { echo "::error::zen.wasm is not a WebAssembly binary"; exit 1; }
      - name: Test under node
        run: ZEN=./out/zen.js EMBED=./out/test_embedding.js INFO=./out/test_script_info.js GCNATIVE=./out/test_gc_native.js ZEN_RUNNER=node bash ./run_tests.sh --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: zen-web-wasm
          path: |
            out/zen.js
            out/zen.wasm

  # ----------------------------------------------------------------- mobile --
  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a,   expect: 'ARM aarch64' }
          - { abi: x86_64,      expect: 'x86-64' }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DZEN_BIN_DIR=${{ github.workspace }}/out
      - name: Build
        run: cmake --build build-android
      - name: Verify the binary targets ${{ matrix.abi }}
        run: |
          file out/zen build-android/libzen/libzen.a
          file out/zen | grep -q '${{ matrix.expect }}' \
            || { echo "::error::zen is not a ${{ matrix.abi }} binary"; exit 1; }
      - name: Stage artifacts
        run: cp build-android/libzen/libzen.a out/
      - uses: actions/upload-artifact@v4
        with:
          name: zen-android-${{ matrix.abi }}
          path: |
            out/zen
            out/libzen.a

  # ---------------------------------------------------- cross-platform gate --
  cross-check:
    name: cross-platform binaries
    needs: [linux, fuzz-embedding, linux-switch-dispatch, linux-host-output, linux-trimmed-modules, macos, windows-msvc, windows-mingw, web, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Report every produced binary
        run: find artifacts -type f -exec file {} \;
      - name: Require one binary per target platform
        run: |
          missing=0
          for expected in \
            artifacts/zen-linux-x86_64/zen \
            artifacts/zen-macos-arm64/zen \
            artifacts/zen-windows-msvc-x64/zen.exe \
            artifacts/zen-windows-mingw-x64/zen.exe \
            artifacts/zen-web-wasm/zen.wasm \
            artifacts/zen-android-arm64-v8a/zen \
            artifacts/zen-android-x86_64/zen
          do
            if [ -f "$expected" ]; then
              echo "ok      $expected"
            else
              echo "MISSING $expected"
              missing=1
            fi
          done
          exit $missing
